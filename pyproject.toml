[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamreceipt"
version = "0.1.0"
description = "Offline completion and tool-dispatch receipts for LLM SSE streams"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ikteder"}]
dependencies = []

[project.scripts]
streamreceipt = "streamreceipt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
