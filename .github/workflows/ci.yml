name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m streamreceipt benchmark --out generated
      - run: python -c "import json; from pathlib import Path; x=json.loads(Path('generated/benchmark.json').read_text()); assert x['streamreceipt_correct']==x['cases']==13"
      - run: python -c "from xml.etree import ElementTree; ElementTree.parse('generated/benchmark.svg')"

